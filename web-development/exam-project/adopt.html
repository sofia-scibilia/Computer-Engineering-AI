<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/pawsnpals_favicon.svg" />

    <title>Paws&Pals | Adopt a Dog</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <img class="logo" src="img/pawsnpals_logo.svg" alt="Paws&Pals logo" />
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="dogs.html">Browse Dogs</a></li>
          <li><a href="favourites.html">Favourites</a></li>
          <li><a href="profile.html">My Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Adopt a Dog</h1>
      <p>Fill out the form below to submit your adoption request.</p>
      <hr>
      <form id="adoption-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="chosen-dog">Chosen Dog:</label>
        <select id="chosen-dog" name="chosen-dog" required>
          <option value="">Select a dog</option>
        </select>

        <hr>

        <button id="submit-adoption-form" type="submit" class="btn">Send request</button>
      </form>
    </main>

    <footer>
      <p>Paws&Pals &copy; 2026 - Built with care for dogs lovers 🐶</p>
      <a href="#top"
        ><img id="back-to-top" src="img/up-arrow.svg" alt="Back to top"
      /></a>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
