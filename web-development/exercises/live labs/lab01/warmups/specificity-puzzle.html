<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specificity puzzle</title>
  <style>
    /* PREDICT FIRST, THEN OPEN THE PAGE.
       For each paragraph, write down the color you expect and why.
       Then verify in DevTools > Elements > Styles (crossed-out rules lost). */

    p                       { color: black; }
    .note                   { color: green; }
    #first                  { color: red; }
    p.note                  { color: blue; }
    section p               { color: orange; }
    section .note           { color: purple; }
    .note                   { color: teal; }   /* same selector as above, later in the file */
    #third                  { color: brown !important; }
  </style>
</head>
<body>
  <section>
    <p id="first" class="note">1. id + class, inside a section</p>
    <p class="note">2. class only, inside a section</p>
    <p id="third" class="note" style="color: magenta;">3. id + class + inline style</p>
    <p>4. no class, inside a section</p>
  </section>
  <p class="note">5. class only, outside the section</p>
</body>
</html>
